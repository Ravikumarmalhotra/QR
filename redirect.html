<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Redirecting...</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0f2f5;
  }
  .loader { text-align: center; }
  .spinner {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #4285F4;
    border-radius: 50%;
    width: 40px; height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto 15px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .error-box { background: #ffe6e6; padding: 20px; border-radius: 10px; color: #d32f2f; }
  /* Disabled Message Card Styling */
  .disabled-box { 
    background: #fff3cd; 
    border: 1px solid #ffeeba; 
    padding: 25px 20px; 
    border-radius: 12px; 
    color: #856404; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    max-width: 320px;
    margin: 0 auto;
  }
  .disabled-box h3 { margin: 0 0 10px 0; font-size: 18px; color: #856404; }
  .disabled-box p { margin: 0; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <p>Redirecting, please wait...</p>
</div>

<!-- Mapping data alag file se load ho raha hai -->
<script src="redirect-mapping-code.js"></script>

<script>
// ==========================================
// STEP 1: URL SE code1 (jaise 200010101) NIKALO
// ==========================================
const urlParams = new URLSearchParams(window.location.search);
const code1 = urlParams.get('id');

if (!code1) {
  document.getElementById('loader').innerHTML = 
    '<div class="error-box">Invalid QR Code - ID missing</div>';
} else {
  
  // ==========================================
  // STEP 2: MAPPING SE code2 DHUNDO
  // ==========================================
  const code2 = qrMapping[code1];

  if (!code2) {
    document.getElementById('loader').innerHTML = 
      '<div class="error-box">QR Code data nahi mila: ' + code1 + '</div>';
  } else {
  
    // ==========================================
    // STEP 3: PURA LINK BANAO (Header + Code)
    // ==========================================
    const link1 = "https://ravikumarmalhotra.github.io/QR/index.html?id=" + code1;
    const link2 = "https://powersupplyorange.github.io/QR/index.html?id=" + code2;

    // ==========================================
    // STEP 4: CONFIG.JSON SE ACTIVE & DISABLE STATUS CHECK KARO
    // ==========================================
    const configURL = `redirect-config.jason?t=${Date.now()}`; // cache-busting
    
    fetch(configURL)
      .then(response => response.json())
      .then(config => {

        // Check if QR feature is disabled
        if (config.disabled === true) {
          const alertMessage = config.message || "QR Code is temporarily disabled.";
          document.getElementById('loader').innerHTML = `
            <div class="disabled-box">
              <h3>Notice</h3>
              <p>${alertMessage}</p>
            </div>
          `;
          return;
        }

        const finalURL = config.active === 'link1' ? link1 : link2;
        
        console.log('Code1 (from QR):', code1);
        console.log('Code2 (mapped):', code2);
        console.log('Active:', config.active);
        console.log('Redirecting to:', finalURL);
        
        window.location.href = finalURL;
      })
      .catch(error => {
        console.error('Config error:', error);
        // Fallback: agar config load na ho, default link1 pe bhej do
        window.location.href = link1;
      });
  }
}
</script>

</body>
</html>
