<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Redirecting...</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0f2f5;
  }
  .loader { text-align: center; }
  .spinner {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #4285F4;
    border-radius: 50%;
    width: 40px; height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto 15px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .error-box { background: #ffe6e6; padding: 20px; border-radius: 10px; color: #d32f2f; }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <p>Redirecting, please wait...</p>
</div>

<!-- Mapping data alag file se load ho raha hai -->
<script src="redirect-mapping-data.js"></script>

<script>
// ==========================================
// STEP 1: URL SE SERIAL NUMBER NIKALO
// ==========================================
const urlParams = new URLSearchParams(window.location.search);
const sn = parseInt(urlParams.get('sn'));

if (!sn) {
  document.getElementById('loader').innerHTML = 
    '<div class="error-box">Invalid QR Code - Serial number missing</div>';
} else {

  // ==========================================
  // STEP 2: MAPPING TABLE SE DATA DHUNDO
  // ==========================================
  const record = qrMapping.find(item => item.sn === sn);
  
  if (!record) {
    document.getElementById('loader').innerHTML = 
      '<div class="error-box">QR Code data nahi mila (SN: ' + sn + ')</div>';
  } else {

    // ==========================================
    // STEP 3: PURA LINK BANAO (Header + Code)
    // ==========================================
    const link1 = "https://rajakhmar.github.io/QR-Project/?id=" + record.code1;
    const link2 = "http://10.160.11.152/Ol/?id=" + record.code2;

    // ==========================================
    // STEP 4: CONFIG.JSON SE ACTIVE STATUS CHECK KARO
    // ==========================================
    const configURL = `config.json?t=${Date.now()}`; // cache-busting
    
    fetch(configURL)
      .then(response => response.json())
      .then(config => {
        const finalURL = config.active === 'link1' ? link1 : link2;
        
        console.log('SN:', sn);
        console.log('Code1:', record.code1, '→', link1);
        console.log('Code2:', record.code2, '→', link2);
        console.log('Active:', config.active);
        
        window.location.href = finalURL;
      })
      .catch(error => {
        console.error('Config error:', error);
        document.getElementById('loader').innerHTML = 
          '<div class="error-box">Config load nahi hua</div>';
      });
  }
}
</script>

</body>
</html>
